[project]
name = "kym"
version = "0.1.0"
description = "Know Your Members: member graph, weekly intros, speaker finder and thread reviver for Discord communities"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.1,<3",
    "discord.py>=2.7,<3",
    "fastembed>=0.9",
    "httpx>=0.28",
    "networkx>=3.5",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rich>=13",
    "sqlalchemy>=2.0.40",
]

[project.scripts]
kym = "kym.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# onnxruntime stopped shipping Intel-Mac wheels after 1.23.x
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
